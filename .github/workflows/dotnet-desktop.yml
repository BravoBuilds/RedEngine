name: Build, test, and publish RedEngine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RedEngine.sln
      - name: Build Release
        run: dotnet build RedEngine.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test RedEngine.sln --configuration Release --no-build
      - name: Publish self-contained Windows x64 executable
        run: dotnet publish src/RedEngine.App/RedEngine.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --output artifacts/RedEngine-win-x64
      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedEngine-win-x64
          path: artifacts/RedEngine-win-x64/**
          if-no-files-found: error
          retention-days: 14
