name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RedEngine.sln
      - run: dotnet build RedEngine.sln --configuration Release --no-restore
      - run: dotnet test RedEngine.sln --configuration Release --no-build